name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check TypeScript (Backend)
        run: npx tsc --noEmit

      - name: Run unit tests (Backend)
        # tests/setup-env.ts sets SKIP_DOTENV and local-only values: no live services needed
        run: npm test

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Lint Frontend (Oxlint & Stylelint)
        working-directory: frontend
        run: |
          npm run lint
          npm run lint:css

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
