# Netlify Configuration for RescueShip Frontend

[build]
  # The frontend app lives in the frontend/ subdirectory
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Proxy all API calls directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://rescueship.onrender.com/api/:splat"
  status = 200
  force = true

# React Router SPA redirect rule: reroutes all page URLs (/billing, /onboarding, /dashboard) to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://sdk.cashfree.com https://js.razorpay.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://rescueship.onrender.com https://api.razorpay.com https://api.cashfree.com https://*.rescueship.io https://*.netlify.app wss: ws:; frame-src https://checkout.razorpay.com https://api.razorpay.com https://sdk.cashfree.com; object-src 'none'; base-uri 'self';"
