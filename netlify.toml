# Netlify Configuration for RescueShip Frontend

[build]
  # The frontend app lives in the frontend/ subdirectory
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# React Router SPA redirect rule: reroutes all page URLs (/billing, /onboarding, /dashboard) to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
