services:
  rescueship-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: rescueship-api-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/rescueship
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file:
      - .env.production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    # 🔒 INFRASTRUCTURE HARDENING
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rescueship-net

  rescueship-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rescueship-frontend-prod
    restart: unless-stopped
    ports:
      # Container nginx listens on unprivileged 8080 (read_only rootfs + cap_drop ALL).
      # Terminate TLS upstream (load balancer / reverse proxy) and forward here.
      - "80:8080"
    depends_on:
      - rescueship-api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - rescueship-net

  mongo:
    image: mongo:7.0
    container_name: rescueship-mongo
    restart: unless-stopped
    # ❌ REMOVED exposed host ports to prevent ransomware/public internet exposure
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rescueship-net

  redis:
    image: redis:7-alpine
    container_name: rescueship-redis
    restart: unless-stopped
    # ❌ REMOVED exposed host ports to prevent public internet exposure
    # 🔒 ADDED: --requirepass to enforce authentication
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rescueship-net

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local

networks:
  rescueship-net:
    driver: bridge
