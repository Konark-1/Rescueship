# RescueShip frontend nginx — SPA serving + same-origin API proxy
# Runs unprivileged on 8080 (host publishes 80/443 from compose).

worker_processes auto;

# read_only container rootfs — pid/tmp live on tmpfs mounts
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # tmpfs-backed temp paths for read_only containers
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path       /tmp/nginx_proxy;
  fastcgi_temp_path     /tmp/nginx_fastcgi;
  uwsgi_temp_path       /tmp/nginx_uwsgi;
  scgi_temp_path        /tmp/nginx_scgi;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-lived SSE connections
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe for Docker HEALTHCHECK
    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # API + webhooks → backend service (compose network DNS)
    location /api/ {
      proxy_pass http://rescueship-api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE: no buffering
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location /webhooks/ {
      proxy_pass http://rescueship-api:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets — cache forever
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Basic hardening headers (CSP is enforced by the API for API traffic;
    # frontend CSP is best set at the edge/CDN where the domain policy is known)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
